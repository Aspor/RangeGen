
[paths]
las_path = "datasets/cloud.laz"
trajectory_path = "datasets/path.dfnav"
output_dir = "output/example/"


datasetroot = "dataset/generated"
coco_file = "dataset/_annotations.coco.json"



[image]
# Optional: if omitted, defaults will be used
width = 1024
height = 128
max_range = 50
elevation_range = [-45, 45]

[sensor]
# Optional: if omitted, defaults will be used
sensor_orientation = [0.0, 0.0, 0.0]
use_trajectory_orientation = true

[processing]


fields=['intensity', 'classification', 'id']

pipeline = 'trajectory'
number_of_processes = 4
sampling_points = 75

skip_start = 100 # trajectory points to be skipped from the start
skip_end = 100   # trajectory points to be skipped from the end
stride = 500   # step size for trajectory


pos_perturbations = 0
orientation_perturbations = 0


randomize = false
rand_range_x = [-25,25]
rand_range_y = [-25,25]
rand_range_z = [-1,4]

rand_range_roll = [-10,10]
rand_range_pitch = [-15,15]
rand_range_yaw = [-180,180]

x_segment  = [0.05,0.95]
y_segment = [0.05,0.95]
z_segment = [0.0,0.5]

classes = [0,1,2]


[pole_detection]

cell_size = 5.5
z_percentile = 50
clearance_m = 0.20

fill_holes = false
eps_xy = 1.0
min_samples = 25
r_max_m = 0.5
verticality_min = 0.85
stride_distance = 30 #step size in meters
h_min = 1.3
local_area_distance = 60
